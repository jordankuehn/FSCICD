[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fscicd"
version = "0.1.0"
description = "Full-Stack CI/CD for LabVIEW code: containerized Mass Compile and VI Analyzer with Bitbucket integration."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FSCICD" }]
dependencies = [
    "click>=8.1",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "yamllint>=1.35",
    "responses>=0.25",
]

[project.scripts]
fscicd = "fscicd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fscicd = ["templates/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
