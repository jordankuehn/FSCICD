# FSCICD LabVIEW CI (runs on the GitHub mirror of the Bitbucket repo).
#
# Option B: Bitbucket repos are mirrored into GitHub and this workflow drives
# the LabVIEW CI engine. Mass Compile + VI Analyzer run inside the NI headless
# LabVIEW container; FSCICD renders the report and posts a build status back to
# Bitbucket.
name: LabVIEW CI

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  labview-ci:
    # Use a self-hosted Linux runner with Docker for real LabVIEW execution.
    # `ubuntu-latest` works for the mock runner / smoke checks.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FSCICD
        run: pip install -e .

      - name: Run LabVIEW CI (Mass Compile + VI Analyzer)
        env:
          # Provided as GitHub secrets; used to report status back to Bitbucket.
          BITBUCKET_USERNAME: ${{ secrets.BITBUCKET_USERNAME }}
          BITBUCKET_APP_PASSWORD: ${{ secrets.BITBUCKET_APP_PASSWORD }}
        run: |
          fscicd run \
            --config fscicd.yml \
            --repo-path . \
            --commit "${GITHUB_SHA}" \
            --report-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fscicd-report
          path: build/reports/
