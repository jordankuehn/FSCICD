---
# Smoke test for the FSCICD orchestrator itself, on the GitHub remote of this
# tooling repository.
#
# LabVIEW application repositories no longer run CI here: they run FSCICD on
# Bitbucket Pipelines against a self-hosted Windows runner (see
# bitbucket-pipelines.yml and examples/bitbucket-pipelines.app-repo.yml). The
# Bitbucket -> GitHub mirror that Option B relied on has been retired.
name: LabVIEW CI

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  labview-ci:
    # Use a self-hosted Linux runner with Docker for real LabVIEW execution.
    # `ubuntu-latest` works for the mock runner / smoke checks.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FSCICD
        run: pip install -e .

      - name: Run the pipeline against the sample project (mock runner)
        env:
          # Provided as GitHub secrets; used to report status back to Bitbucket.
          BITBUCKET_USERNAME: ${{ secrets.BITBUCKET_USERNAME }}
          BITBUCKET_APP_PASSWORD: ${{ secrets.BITBUCKET_APP_PASSWORD }}
          RUN_URL: >-
            ${{ github.server_url }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}
        run: |
          fscicd run \
            --config examples/fscicd.yml \
            --repo-path examples/sample-labview-project \
            --commit "${GITHUB_SHA}" \
            --report-url "${RUN_URL}"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fscicd-report
          path: build/reports/
