---
# FSCICD runs its own CI on Bitbucket Pipelines.
#
# Two kinds of step, because only one of them needs LabVIEW:
#
#   * "Self-test" runs on Atlassian's cloud Linux runners and exercises the
#     orchestrator with the mock LabVIEW backend - no LabVIEW, no Docker.
#   * "LabVIEW CI" runs on a self-hosted Windows runner and drives the real NI
#     headless LabVIEW container. Atlassian does not host Windows runners, so
#     this step only runs where such a runner is registered and online.
#
# Both steps run against the sample-project fixture, so both pass --no-status:
# the fixture's configured Bitbucket coordinates are placeholders, and posting a
# status to a repository that does not exist would fail the step once real
# credentials are present. Application repos post status; this repo does not.
#
# Windows runner prerequisites (see README):
#   * Docker Desktop switched to Windows containers
#   * nationalinstruments/labview:<tag>-windows pulled
#   * Python 3.10+ on PATH
image: python:3.12

definitions:
  steps:
    - step: &labview-windows
        name: LabVIEW CI (Windows container)
        runs-on:
          - self.hosted
          - windows
          - labview
        script:
          # Windows runners execute steps in PowerShell on the host, so the
          # virtualenv keeps FSCICD's dependencies out of the host Python.
          - python -m venv .venv
          - .venv\Scripts\python -m pip install --upgrade pip
          - .venv\Scripts\python -m pip install "."
          # Pipelines injects DOCKER_HOST=tcp://localhost:2375 for the Docker
          # service it runs on CLOUD runners. A self-hosted Windows runner has no
          # such service - Docker Desktop listens on a named pipe - so that value
          # has to be overridden or every docker call dials a dead port. Set per
          # command, since each script line may be its own PowerShell process.
          - >
            $env:DOCKER_HOST = 'npipe:////./pipe/docker_engine';
            $os = ((docker info --format '{{.OSType}}') -join '').Trim();
            if ($LASTEXITCODE -ne 0) {
            Write-Error 'Cannot reach Docker on the runner host. Is Docker Desktop running?';
            exit 1 };
            if ($os -ne 'windows') {
            Write-Error "Docker is in '$os' container mode; switch Docker Desktop to Windows
            containers (tray icon > Switch to Windows containers).";
            exit 1 };
            Write-Host "Docker container mode: $os"
          - >
            $env:DOCKER_HOST = 'npipe:////./pipe/docker_engine';
            .venv\Scripts\fscicd run
            --config examples/fscicd.windows.yml
            --repo-path examples/sample-labview-project
            --commit ${env:BITBUCKET_COMMIT}
            --no-status
        artifacts:
          - build/reports/**
          # The raw LabVIEWCLI log is the ground truth when a compile problem is
          # not reported as expected. It lands under the --repo-path.
          - examples/sample-labview-project/build/labview-out/**

pipelines:
  default:
    - step:
        name: Self-test (lint, unit tests, mock pipeline)
        script:
          - python -m pip install --upgrade pip
          - pip install -e ".[dev]"
          - ruff check .
          - ruff format --check .
          - yamllint bitbucket-pipelines.yml examples
          - pytest
          - >
            fscicd run --config examples/fscicd.yml
            --repo-path examples/sample-labview-project
            --commit "$BITBUCKET_COMMIT"
            --no-status
        artifacts:
          - build/reports/**
    - step: *labview-windows

  custom:
    # Run the Windows LabVIEW step on demand, without the cloud self-test.
    labview-windows:
      - step: *labview-windows
